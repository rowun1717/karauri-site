<!DOCTYPE html>
<html lang="ja"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>NEWS | LYRIRACHA</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <a class="header-logo" href="index.html">
            <span class="header-logo-main">LYRIC</span>
            <span class="header-logo-sub">RACHA</span>
        </a>
        <a href="index.html" class="news-preview__all">← HOME</a>
    </header>

    <main class="news-page">
        <p class="news-preview__eyebrow">STRAY KIDS / LYRIRACHA · TRANSMISSION LOG</p>
        <h1 class="news-glitch" data-text="NEWS">NEWS</h1>
        <p class="news-page__intro">楽曲追加・サイト更新・お知らせの記録。</p>
        <div id="allNewsList" class="news-log"></div>

        <section class="news-schedule">
        <div class="news-schedule-heading">
            <p class="news-schedule-label">UPCOMING TRANSMISSIONS</p>
            <h2 class="news-glitch" data-text="SCHEDULE">SCHEDULE</h2>
            <p>LYRIRACHAの更新予定・実装予定を確認できます。</p>
        </div>

        <div class="news-countdown">
            <span>NEXT UPDATE / COUNTDOWN</span>
            <strong id="nextUpdateCountdown">-- DAYS</strong>
            <p id="nextUpdateTitle">次回更新予定を確認中...</p>
        </div>

        <div class="news-calendar">
            <div class="news-calendar-header">
            <button id="calendarPrev" type="button" aria-label="前の月">←</button>
            <h3 id="calendarMonth"></h3>
            <button id="calendarNext" type="button" aria-label="次の月">→</button>
            </div>
            <div id="calendarGrid" class="news-calendar-grid"></div>
        </div>

        
            <section class="news-schedule-details">
            <div class="news-schedule-details-heading">
                <p>MONTHLY TRANSMISSION LOG</p>
                <h3>SCHEDULE DETAILS</h3>
                <span>月間更新予定</span>
            </div>

            <div id="calendarEventList" class="news-calendar-events"></div>
            </section>

        </section>

            </main>
            <script src="js/news-data.js" defer></script>
            <script src="js/news.js" defer></script>
            <script src="js/news-schedule.js" defer></script>
</body>
</html>
